<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KCPVPN Web UI</title>
<script src="chart.umd.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">🔐 KCP<span>VPN</span></div>
  <span id="modeBadge" class="badge">…</span>
  <span id="verBadge" class="badge">v…</span>
  <span style="flex:1"></span>
  <button class="ghost icon" id="themeBtn" onclick="toggleTheme()" title="Theme">🌙</button>
  <button class="ghost icon" id="langBtn" onclick="toggleLang()" title="Language">中/EN</button>
  <button class="ghost" onclick="refresh()" data-i18n="refresh">刷新</button>
  <button class="ghost" onclick="logout()" data-i18n="logout">退出</button>
</header>

<div class="main" id="main" style="display:none">
  <nav class="tabs">
    <button class="tab active" data-tab="overview" onclick="switchTab('overview')" data-i18n="tabOverview">概览</button>
    <button class="tab" data-tab="conn" onclick="switchTab('conn')" data-i18n="tabConn">连接</button>
    <button class="tab" data-tab="config" onclick="switchTab('config')" data-i18n="tabConfig">配置</button>
  </nav>

  <section class="tab-panel" id="panel-overview">
    <div class="grid" id="statCards"></div>

    <div class="section-title" data-i18n="charts">实时曲线</div>
    <div class="charts">
      <div class="card full">
        <h3 data-i18n="chartTraffic">流量速率 (KB/s)</h3>
        <div class="chart-box"><canvas id="chartTraffic"></canvas></div>
      </div>
      <div class="card">
        <h3 data-i18n="chartClients">在线客户端</h3>
        <div class="chart-box"><canvas id="chartClients"></canvas></div>
      </div>
      <div class="card" id="dropsCard">
        <h3 data-i18n="chartDrops">VSwitch 丢弃 (帧/s)</h3>
        <div class="chart-box"><canvas id="chartDrops"></canvas></div>
      </div>
    </div>
  </section>

  <section class="tab-panel" id="panel-conn" style="display:none">
    <div id="clientSection" style="display:none">
      <div class="section-title" data-i18n="clientSection">在线客户端</div>
      <div class="card">
        <table id="clientTable">
          <thead><tr><th data-i18n="thIp4">IPv4</th><th data-i18n="thIp6">IPv6</th><th data-i18n="thMac">MAC</th><th data-i18n="thDur">连接时长</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
        <div id="clientEmpty" class="muted" style="padding:12px 0" data-i18n="noClients">暂无客户端连接</div>
      </div>
    </div>

    <div id="tunnelSection" style="display:none">
      <div class="section-title" data-i18n="tunnelState">隧道状态</div>
      <div class="card">
        <table>
          <tbody id="tunnelBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="tab-panel" id="panel-config" style="display:none">
    <div class="section-title" data-i18n="configSection">配置编辑</div>
    <div class="cfg-groups" id="cfgGroups"></div>
    <div class="card" style="margin-top:16px">
      <div class="actions" style="margin:0">
        <button onclick="saveConfig()" data-i18n="saveRestart">保存并重启</button>
        <span id="saveHint" class="muted" data-i18n="saveHint">保存后写入 config.json 并自动重启进程生效</span>
      </div>
    </div>
  </section>
</div>

<div class="overlay" id="loginOverlay" style="display:none">
  <div class="login">
    <h2 data-i18n="loginTitle">访问令牌</h2>
    <p data-i18n="loginDesc">请输入 web-token（配置中设置）。绑定 public 时必须鉴权。</p>
    <input type="password" id="tokenInput" placeholder="Bearer token" autocomplete="off">
    <div class="actions"><button onclick="login()" data-i18n="enter">进入</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
